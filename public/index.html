<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — preview</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="register">
    <div class="card-header">
      <div class="logo">C</div>
      <h1>Welcome back</h1>
      <p>We're happy to see you again</p>
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="username">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="signupBtn">Sign up</button>
      <button class="btn btn-primary" id="loginBtn">Log in</button>
    </div>
    <p style="white-space: pre;" id="feedback"> </p>
  </div>

  <div id="chat" style="display: none;">
    <div id="sidebar">
      <div><input id="user-search-textbox" type="text" placeholder="Search Username"></div>
      <div id="user-search-display">
        <button>ash_kt</button>
        <button>marlowe</button>
        <button>quinn.dev</button>
      </div>
      <div id="connections-display">
        <button>ash_kt</button>
        <button>marlowe</button>
        <button>quinn.dev</button>
        <button>rivera</button>
        <button>Global</button>
      </div>
    </div>

    <div id="main-content">
      <div id="chat-content">
        <p class="chat-message"><span>marlowe</span>anyone tried the new build yet?</p>
        <p class="chat-message"><span>quinn.dev</span>yeah, sidebar feels a lot snappier now</p>
        <p class="chat-message"><span>you</span>nice, pushing the css update in a sec</p>
        <p class="chat-message"><span>rivera</span>🔥</p>
      </div>
      <div id="text-box">
        <input id="textbox" placeholder="Message #general">
      </div>
    </div>
  </div>

  <script>
    // Demo-only toggle so the chat view can be previewed without a live socket.io server.
    document.getElementById('loginBtn').addEventListener('click', () => {
      document.getElementById('register').style.display = 'none';
      document.getElementById('chat').style.display = 'flex';
    });
  </script>
</body>

</html>
